<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Knockerz Black Friday</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000}
.roll{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:2px}
@media(min-width:900px){.roll{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.roll a{display:block;aspect-ratio:4/5;overflow:hidden;background:#111}
.roll img{width:100%;height:100%;object-fit:cover;display:block}
#v{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;touch-action:pan-y}
#v.on{display:flex}#v img{max-width:100%;max-height:100%;object-fit:contain}
#v span{position:fixed;top:0;bottom:0;width:30%;cursor:pointer}#p{left:0}#n{right:0}
#x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:14px;color:#fff;font:28px/1 system-ui;cursor:pointer;z-index:2}
</style></head><body>
<div class="roll">

<div id="v"><img id="vi" alt=""><span id="p"></span><span id="n"></span><b id="x">&times;</b></div>
<script>
const a=[...document.querySelectorAll('.roll a')],v=document.getElementById('v'),vi=document.getElementById('vi');let i=0;
const show=k=>{i=(k+a.length)%a.length;vi.src=a[i].getAttribute('href');v.classList.add('on')};
a.forEach((e,k)=>e.onclick=ev=>{ev.preventDefault();show(k)});
p.onclick=()=>show(i-1);n.onclick=()=>show(i+1);x.onclick=()=>v.classList.remove('on');
document.onkeydown=e=>{if(!v.classList.contains('on'))return;if(e.key=='ArrowLeft')show(i-1);if(e.key=='ArrowRight')show(i+1);if(e.key=='Escape')v.classList.remove('on')};
let sx=0;v.addEventListener('touchstart',e=>sx=e.touches[0].clientX);v.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>40)show(i+(d<0?1:-1))});
</script></body></html>
